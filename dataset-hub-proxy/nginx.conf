server {
    listen 80;
    client_max_body_size 2048m;

    auth_basic "Dataset Hub";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Serve exported dataset archives directly from disk so large files never pass through Streamlit's memory.
    location = /dataset-hub {
        return 301 /dataset-hub/;
    }

    location /dataset-hub/downloads/ {
        alias /exports/;
        add_header Content-Disposition "attachment";
        default_type application/zip;
    }

    location /dataset-hub/ {
        proxy_pass http://dataset-hub:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
    }
}