services:
  app:
    image: heartexlabs/label-studio:1.23.0
    ports:
      - "8080:8080"
    environment:
      - JSON_LOG=${JSON_LOG:-1}

      # PostgreSQL
      - DJANGO_DB=default
      - POSTGRE_NAME=${POSTGRES_DB:-postgres}
      - POSTGRE_USER=${POSTGRES_USER:-postgres}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRE_HOST=${POSTGRES_HOST:-db}
      - POSTGRE_PORT=${POSTGRES_PORT:-5432}

      # Label Studio
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
      - LOCAL_FILES_SERVING_ENABLED=${LOCAL_FILES_SERVING_ENABLED:-true}
      - LOCAL_FILES_DOCUMENT_ROOT=${LOCAL_FILES_DOCUMENT_ROOT:-/label-studio/data}
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=${LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT:-/label-studio/data}

    volumes:
      - ./mydata:/label-studio/data

    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  ml:
    build:
      context: ./ml
    ports:
      - "9090:9090"
    environment:
      - WORKERS=1
      - THREADS=4
      - TIMEOUT=300
      - GUNICORN_TIMEOUT=300
      - MODEL_DIR=/app/models
      - YOLO_MODEL=best.pt
      - FORCE_CPU=true
      - DATA_ROOT=/app/data
    volumes:
      - ./models:/app/models
      - ./mydata:/app/data
    depends_on:
      - app

  dataset-hub:
    build:
      context: ./dataset-hub
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      - DATA_DIR=/data
      - DATA_SOURCE=${DATA_SOURCE:-api}
      - LABEL_STUDIO_URL=http://app:8080
      - LABEL_STUDIO_API_TOKEN=${LABEL_STUDIO_API_TOKEN:-}
      - LABEL_STUDIO_PROJECT_ID=${LABEL_STUDIO_PROJECT_ID:-1}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - ./mydata:/data
      - dataset-hub-exports:/tmp/dataset-export

  dataset-hub-proxy:
    build:
      context: ./dataset-hub-proxy
    ports:
      - "8501:80"
    environment:
      - BASIC_AUTH_USERNAME=${FRAME_EXTRACTOR_USERNAME}
      - BASIC_AUTH_PASSWORD=${FRAME_EXTRACTOR_PASSWORD}
    volumes:
      - dataset-hub-exports:/exports:ro
    depends_on:
      - dataset-hub

volumes:
  dataset-hub-exports:
